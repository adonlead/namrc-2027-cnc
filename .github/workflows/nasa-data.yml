name: Refresh NASA Milling dataset
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 1 * *'
permissions:
  contents: write
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Retrieve and process NASA archive
        run: python scripts/process_nasa.py
      - name: Commit updated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/api/manifest.json public/api/experiments.json
          git diff --cached --quiet || (git commit -m "Update NASA milling experimental data" && git push)
